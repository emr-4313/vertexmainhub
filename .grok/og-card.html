<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: "Inter";
    src: url("fonts/Inter-ExtraBold.woff2") format("woff2");
    font-weight: 800;
    font-style: normal;
  }
  @font-face {
    font-family: "Inter";
    src: url("fonts/Inter-Medium.woff2") format("woff2");
    font-weight: 500;
    font-style: normal;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #080808;
  }
  body {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Inter", "Liberation Sans", sans-serif;
  }
  .grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(to right, rgba(255,255,255,0.06) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,0.06) 1px, transparent 1px);
    background-size: 48px 48px;
    -webkit-mask-image: radial-gradient(ellipse at 50% 46%, #000 22%, transparent 72%);
    mask-image: radial-gradient(ellipse at 50% 46%, #000 22%, transparent 72%);
  }
  .lockup {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  img {
    width: 300px;
    height: auto;
    display: block;
    margin-bottom: 8px;
  }
  h1 {
    font-weight: 800;
    font-size: 92px;
    line-height: 0.95;
    letter-spacing: -0.045em;
    color: #ffffff;
  }
  p {
    margin-top: 18px;
    font-weight: 500;
    font-size: 28px;
    line-height: 1;
    letter-spacing: -0.01em;
    color: #f2f2f2;
  }
</style>
</head>
<body>
  <div class="grid" aria-hidden="true"></div>
  <div class="lockup">
    <img src="crescent.png" alt="" />
    <h1>Vertex Hub</h1>
    <p>Roblox yer ve model dosyaları</p>
  </div>
</body>
</html>
